name: iMail Desktop Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore desktop/IMail.Desktop/IMail.Desktop.csproj
      - name: Build
        run: dotnet build desktop/IMail.Desktop/IMail.Desktop.csproj -c Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish desktop/IMail.Desktop/IMail.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o desktop/artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: imail-windows-x64
          path: desktop/artifacts/win-x64/
