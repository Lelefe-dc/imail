name: imail
publish_to: 'none'
description: Ithute iMail mobile client for Mailbox-DNS and standard IMAP/SMTP providers.
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.0.0
  cupertino_icons: ^1.0.8
  enough_mail: ^2.1.7
  file_picker: ^8.1.7
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  intl: ^0.20.2
  provider: ^6.1.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
